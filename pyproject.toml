[project]
name = "f1deg"
version = "0.1.0"
description = "F1 tire degradation modeling and race strategy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["formula1", "machine-learning", "reinforcement-learning", "tire-degradation"]

dependencies = [
    "fastf1>=3.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "pandera>=0.18",
    # Dashboard runtime deps (needed for Streamlit Cloud deployment via uv sync)
    "streamlit>=1.32",
    "plotly>=5.18",
    # Model runtime deps (linear uses scikit-learn above; bayesian + gbm below)
    "numpyro>=0.14",
    "jax[cpu]>=0.4",
    "xgboost>=2.0",
    "lightgbm>=4.6.0",
]

[project.optional-dependencies]
gbm     = ["lightgbm>=4.0"]
deep    = ["torch>=2.1"]
viz       = ["matplotlib>=3.8", "seaborn>=0.13"]
all = ["f1deg[gbm,deep,viz]"]

[project.scripts]
f1-ingest   = "f1deg.data.ingest:main"
f1-features = "f1deg.data.features:main"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1deg"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipython>=8.0",
    "ipykernel>=7.0",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format (replaces flake8, isort, black, pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py313"
src            = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function call in default args
]

[tool.ruff.lint.isort]
known-first-party = ["f1deg"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.13"
strict                 = false
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
files                  = ["src/f1deg"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths       = ["tests"]
addopts         = "-ra -q --strict-markers --cov=f1deg --cov-report=term-missing"
markers = [
    "slow: marks tests that hit external APIs or run full MCMC",
    "integration: marks tests that require downloaded data",
]

[tool.coverage.run]
source   = ["src/f1deg"]
omit     = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 60
