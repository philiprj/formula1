# Feature engineering configuration

# Filters to apply (in order)
# Use track_status_flag to keep SC/VSC laps as features (better for strategy modeling).
# Use track_status to remove them entirely (original behavior).
filters:
  - accurate            # IsAccurate == True
  - track_status_flag   # Flag SC/VSC laps (keep them); remove red flag laps only
  - pit_laps            # Remove pit in/out laps
  - first_lap           # Remove lap 1
  - outliers            # Remove laps > median + 3*IQR per race

# Track status codes to exclude
track_status_exclude:
  - "4"   # Safety Car
  - "5"   # Red Flag
  - "6"   # Virtual Safety Car

# Outlier detection
outlier_iqr_multiplier: 3.0

# Compound mapping
compounds:
  SOFT: 0
  MEDIUM: 1
  HARD: 2
  INTERMEDIATE: 3
  WET: 4

# Weather features to include
weather_features:
  - AirTemp
  - TrackTemp
  - Humidity
  - Pressure
  - WindSpeed
  - WindDirection
  - Rainfall

# Compound-aware outlier detection
outlier_zscore_threshold: 2.5
outlier_small_group_iqr: 2.0

# Output columns in processed dataset
output_columns:
  - race_id
  - circuit_id
  - driver_id
  - constructor_id
  - lap_number
  - lap_time_seconds
  - tyre_life
  - tyre_life_sq
  - compound
  - fuel_mass_kg
  - stint_number
  - stint_lap
  - air_temp
  - track_temp
  - humidity
  - pressure
  - wind_speed
  - wind_direction
  - rainfall
  # Traffic / position features
  - position
  - position_change
  - gap_ahead_seconds
  - gap_behind_seconds
  - traffic_density
  # Gap evolution (strategy-critical for undercut/overcut)
  - gap_ahead_delta
  - gap_behind_delta
  # Stint context
  - race_progress
  - stint_fraction
  - is_final_stint
  # Track status flags (SC/VSC kept as features for strategy modeling)
  - is_under_sc
  - is_under_vsc
  # Interaction features
  - compound_x_track_temp
  - tyre_life_x_track_temp
