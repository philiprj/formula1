# Tier 1: Ridge regression baseline
model_type: linear

# Ridge regularization strength
alpha: 1.0

# Features used
features:
  - tyre_life
  - tyre_life_sq
  - fuel_mass_kg
  - track_temp
  - air_temp
  - humidity
  - wind_speed
  - rainfall
  # Traffic / position features
  - position
  - gap_ahead_seconds
  - traffic_density
  # Stint context
  - race_progress
  # Circuit characteristics (numeric)
  - track_length_km
  - n_corners
  - tire_stress
  - pit_loss_seconds
  # DRS effect
  - drs_likely
  # Interaction features
  - compound_x_track_temp
  - tyre_life_x_compound
  - fuel_mass_x_track_temp
  # Weekend calibration features
  - circuit_baseline_pace
  - driver_pace_vs_field
  - fp_deg_rate_soft
  - fp_deg_rate_medium
  - fp_deg_rate_hard
  - weekend_track_temp
  - quali_position
  - expected_fp3_race_delta
  # SC/restart features
  - laps_since_sc_end
  - laps_since_red_flag
  - had_sc_this_stint
# Categorical features (one-hot encoded)
categorical_features:
  - compound
  - circuit_id
  - driver_id
  - constructor_id

# Prediction interval method: "residual" (assumes normal residuals)
interval_method: residual
