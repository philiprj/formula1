# Tier 3: Gradient boosted trees (XGBoost / LightGBM)
model_type: gbm

# Which implementation to use
backend: xgboost  # or "lightgbm"

# Features
features:
  - tyre_life
  - tyre_life_sq
  - fuel_mass_kg
  - track_temp
  - air_temp
  - humidity
  - wind_speed
  - rainfall
  # Traffic / position features
  - position
  - position_change
  - gap_ahead_seconds
  - gap_behind_seconds
  - traffic_density
  # Stint context
  - race_progress
  - stint_fraction
  # Interaction features
  - compound_x_track_temp
  - tyre_life_x_track_temp

categorical_features:
  - compound
  - circuit_id
  - driver_id
  - constructor_id

# XGBoost hyperparameters
xgboost:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_alpha: 0.1
  reg_lambda: 1.0
  tree_method: hist

# LightGBM hyperparameters
lightgbm:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 20
  reg_alpha: 0.1
  reg_lambda: 1.0

# Quantile regression for prediction intervals
quantiles: [0.025, 0.5, 0.975]

# Optuna hyperparameter tuning
tuning:
  enabled: false
  n_trials: 50
  max_folds: 10  # Subset of LORO folds for speed
  search_space:
    n_estimators: [300, 1000]
    max_depth: [4, 8]
    learning_rate: [0.01, 0.1]
    subsample: [0.6, 0.9]
    colsample_bytree: [0.6, 0.95]
    min_child_weight: [3, 15]
    reg_alpha: [0.01, 1.0]
    reg_lambda: [0.1, 5.0]
