# Tier 4: Sequence model (LSTM/GRU)
# Smaller architecture optimised for ~3-5K stints
model_type: sequence

# Architecture — shrunk from 2x128 to 1x64
architecture: lstm
hidden_size: 64
num_layers: 1
dropout: 0.3

# Auxiliary degradation-rate head
aux_deg_head: true
aux_loss_weight: 0.3  # Weight of delta loss vs primary lap-time loss

# Embedding dimensions (dropped constructor — too few stints per constructor)
embedding_dims:
  compound: 4
  circuit_id: 6
  driver_id: 6

# Continuous input features
continuous_features:
  - tyre_life
  - fuel_mass_kg
  - track_temp
  - air_temp
  - humidity
  - wind_speed
  - rainfall
  # Traffic / position features
  - position
  - position_change
  - gap_ahead_seconds
  - gap_behind_seconds
  - traffic_density
  # Stint context
  - race_progress
  - stint_fraction
  # Circuit characteristics (numeric)
  - track_length_km
  - n_corners
  - tire_stress
  - pit_loss_seconds
  # DRS effect
  - drs_likely
  # Interaction features
  - compound_x_track_temp
  - tyre_life_x_compound
  - fuel_mass_x_track_temp
  - humidity_x_rainfall
  # Weekend calibration features
  - circuit_baseline_pace
  - driver_pace_vs_field
  - fp_deg_rate_soft
  - fp_deg_rate_medium
  - fp_deg_rate_hard
  - weekend_track_temp
  - quali_position
  - expected_fp3_race_delta
  # SC/restart features
  - laps_since_sc_end
  - laps_since_red_flag
  - had_sc_this_stint

# Training
training:
  batch_size: 64
  epochs: 150
  learning_rate: 0.0005
  weight_decay: 0.001
  patience: 15
  grad_clip: 1.0
  scheduler: cosine

# MC dropout for prediction intervals — 50 samples for better calibration
mc_dropout:
  num_samples: 50
  dropout_rate: 0.3

# Sequence padding
max_stint_length: 50
