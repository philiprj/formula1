# Tier 4: Sequence model (LSTM/GRU)
model_type: sequence

# Architecture
architecture: lstm  # or "gru"
hidden_size: 128
num_layers: 2
dropout: 0.2
bidirectional: false

# Embedding dimensions for categorical features
embedding_dims:
  compound: 4
  circuit_id: 8
  driver_id: 8
  constructor_id: 4

# Continuous input features
continuous_features:
  - tyre_life
  - fuel_mass_kg
  - track_temp
  - air_temp
  - humidity
  - wind_speed
  - rainfall
  # Traffic / position features
  - position
  - position_change
  - gap_ahead_seconds
  - gap_behind_seconds
  - traffic_density
  # Stint context
  - race_progress
  - stint_fraction
  # Circuit characteristics (numeric)
  - track_length_km
  - n_corners
  - tire_stress
  - pit_loss_seconds
  # DRS effect
  - drs_likely
  # Interaction features
  - compound_x_track_temp
  - tyre_life_x_compound
  - fuel_mass_x_track_temp
  - humidity_x_rainfall
  # Weekend calibration features
  - circuit_baseline_pace
  - driver_pace_vs_field
  - fp_deg_rate_soft
  - fp_deg_rate_medium
  - fp_deg_rate_hard
  - weekend_track_temp
  - quali_position
  - expected_fp3_race_delta
  # SC/restart features
  - laps_since_sc_end
  - laps_since_red_flag
  - had_sc_this_stint

# Training
training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10  # early stopping
  scheduler: cosine  # learning rate schedule

# MC dropout for prediction intervals
mc_dropout:
  num_samples: 100
  dropout_rate: 0.2

# Sequence padding
max_stint_length: 50
